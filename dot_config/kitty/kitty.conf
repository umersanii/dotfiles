# linux_display_server auto

# Allow remote control for scripting
allow_remote_control yes

# Terminal type
term xterm-kitty

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Font rendering (fix low res pixels)
disable_ligatures never
font_features none
# Enable anti-aliasing for smoother fonts
text_composition_strategy platform
undercurl_style thin-sparse

# Colors - Monochrome with essential accents
foreground #ffffff
background #000000
selection_foreground #000000
selection_background #ffffff

# Cursor colors
cursor #ffffff
cursor_text_color #000000

# Black
color0 #000000
color8 #666666

# Red (errors - keep colored)
color1 #ff5555
color9 #ff6e6e

# Green (success - keep colored)
color2  #50fa7b
color10 #69ff94

# Yellow (warnings - colored)
color3  #f1fa8c
color11 #ffff99

# Blue (info - grayscale)
color4  #aaaaaa
color12 #bbbbbb

# Magenta (highlights - grayscale)
color5  #999999
color13 #aaaaaa

# Cyan (commands - grayscale)
color6  #aaaaaa
color14 #bbbbbb

# White
color7  #ffffff
color15 #ffffff

# Background opacity
background_opacity 1.0

# Window size
remember_window_size yes
initial_window_width 200c
initial_window_height 50c

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
# Copy shortcuts
map ctrl+a send_text all /home/sani/.config/kitty/copy_all_wrapper.sh\n
map ctrl+shift+a send_text all /home/sani/.config/kitty/copy_last_wrapper.sh\n
