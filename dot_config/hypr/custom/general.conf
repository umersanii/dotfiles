# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`

# Render XWayland (X11) apps at native pixel density instead of letting the
# compositor bitmap-upscale them by the 1.25 monitor scale — kills blurry text
# in Qt/X11 apps (e.g. Gazebo). Per-app UI size is restored via QT_SCALE_FACTOR.
xwayland {
    force_zero_scaling = true
}
