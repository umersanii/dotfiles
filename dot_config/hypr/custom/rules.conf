# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Live subtitle overlay
windowrule = match:title ^(whisper-subs)$, float on
windowrule = match:title ^(whisper-subs)$, pin on
windowrule = match:title ^(whisper-subs)$, move 25% 1%
windowrule = match:title ^(whisper-subs)$, size 50% 7%
windowrule = match:title ^(whisper-subs)$, border_size 0
windowrule = match:title ^(whisper-subs)$, no_shadow on
windowrule = match:title ^(whisper-subs)$, no_initial_focus on

# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1


