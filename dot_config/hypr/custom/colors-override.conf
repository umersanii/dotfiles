# Black and White Override - Add this after colors.conf in hyprland.conf

general {
    col.active_border = rgba(FFFFFFFF)     # White active border
    col.inactive_border = rgba(33333355)   # Dark gray inactive border
}

misc {
    background_color = rgba(000000FF)      # Pure black background
}


windowrule = border_color rgba(FFFFFFAA) rgba(FFFFFF77), match:pin 1
